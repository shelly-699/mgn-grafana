# act-pubx-workflow: v5 variant=plain sha256=b3ab329a6b05720f
name: act-pubx session runner

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'base64(加密载荷)'
        required: true
      os:
        description: 'runner os'
        required: false
        default: 'ubuntu-latest'
      timeout:
        description: '有效工作时长(分钟)'
        required: false
        default: '240'
      job_timeout:
        description: 'job 硬上限(分钟)'
        required: false
        default: '260'
      cache:
        description: '1=启用缓存, 0=关闭'
        required: false
        default: '1'
      cache_ns:
        description: '缓存命名空间: 会话=ct, 一次性/客户端=oneoff(两边互不还原)'
        required: false
        default: 'oneoff'
      group:
        description: '组名; 空 = 不用组存储'
        required: false
        default: ''
      store_url:
        description: '组存储工具下载地址'
        required: false
        default: ''
      store_interval:
        description: '组存储推送间隔秒(0 = 只在收工推)'
        required: false
        default: '900'

jobs:
  run:
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}
    timeout-minutes: "${{ fromJSON(github.event.inputs.job_timeout || 260) > 360 && 360 || fromJSON(github.event.inputs.job_timeout || 260) }}"
    steps:
      - name: 准备
        id: prep
        env:
          ACT_PUBX_D0: ${{ secrets.ACT_PUBX_D0 }}
          ACT_PUBX_PAYLOAD: ${{ github.event.inputs.payload }}
          T0: ${{ github.token }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/d0"; mkdir -p "$K"; chmod 700 "$K"
          printf '%s\n' "$ACT_PUBX_D0" > "$K/d0.bin"; chmod 600 "$K/d0.bin"
          curl -fsS -H "Authorization: Bearer $T0" -H "Accept: application/vnd.github.raw" -o "$K/e0.bin" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.act_pubx.pub?ref=$GITHUB_REF_NAME" \
            || curl -fsS -o "$K/e0.bin" \
                 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/.act_pubx.pub" \
            || echo "::warning::取公开材料失败 → 本轮不做缓存(会话不受影响)"
          D="$RUNNER_TEMP/actx"; mkdir -p "$D"
          printf '%s' "$ACT_PUBX_PAYLOAD" | base64 -d > "$D/p.ct"
          if [ "$(head -c1 "$D/p.ct")" = "{" ]; then
            ENC="$D/enc"; mkdir -p "$ENC"
            jq -r .k "$D/p.ct" | base64 -d > "$ENC/cek.bin"
            jq -r .c "$D/p.ct" | base64 -d > "$ENC/body.bin"
            openssl pkeyutl -decrypt -inkey "$K/d0.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -in "$ENC/cek.bin" -out "$ENC/cek.hex"
            openssl enc -d -aes-256-cbc -K "$(cat "$ENC/cek.hex")" -iv "$(jq -r .n "$D/p.ct")" -in "$ENC/body.bin" -out "$D/p.sh"
            rm -f "$ENC/cek.bin" "$ENC/cek.hex" "$ENC/body.bin"
          else
            openssl smime -decrypt -binary -inform DER -inkey "$K/d0.bin" -in "$D/p.ct" -out "$D/p.sh"
          fi
          chmod 700 "$D/p.sh"
          CD=""
          if sudo mkdir -p /mnt/actcache 2>/dev/null && sudo chown "$(id -u):$(id -g)" /mnt/actcache 2>/dev/null; then
            CD=/mnt/actcache
          fi
          [ -n "$CD" ] || CD="$HOME/actcache"
          mkdir -p "$CD"
          echo "cachedir=$CD" >> "$GITHUB_OUTPUT"
          echo "就绪: $K, 载荷 $D/p.sh, 缓存目录 $CD"

      - name: 启动会话
        env:
          WORK_MIN: ${{ github.event.inputs.timeout || 240 }}
        run: |
          set -uo pipefail
          case "$WORK_MIN" in ''|*[!0-9]*) WORK_MIN=240 ;; esac
          if [ "$WORK_MIN" -gt 340 ]; then
            echo "warn: 有效时长 ${WORK_MIN}min 超出 340(6h 硬上限留 20min 备份), 收敛为 340"
            WORK_MIN=340
          fi
          [ "$WORK_MIN" -lt 1 ] && WORK_MIN=1
          SOFT_SEC=$(( WORK_MIN * 60 ))
          D="$RUNNER_TEMP/actx"
          export ACTX_LOG_FILE="$D/session.log"
          echo "软超时 ${SOFT_SEC}s (有效时长 ${WORK_MIN}min; job 上限另留 20min 给缓存归档)"
          nohup bash -c "timeout -k 60 $SOFT_SEC bash '$D/p.sh'; echo \$? > '$D/session.rc'" \
            > "$D/session.log" 2>&1 < /dev/null &
          echo $! > "$D/session.pid"
          disown 2>/dev/null || true
          sleep 2
          P=$(cat "$D/session.pid")
          if kill -0 "$P" 2>/dev/null; then
            echo "✓ 会话已后台启动 (pid $P) → 缓存下载/解密在背后进行, 不挡登录"
          else
            echo "::warning::会话启动即退出 (rc=$(cat "$D/session.rc" 2>/dev/null || echo '?'))"
          fi

      - name: 恢复加密缓存
        if: github.event.inputs.cache != '0' && steps.prep.outputs.cachedir != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.prep.outputs.cachedir }}
          key: ${{ runner.os }}-actcache-${{ github.event.inputs.cache_ns }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-actcache-${{ github.event.inputs.cache_ns }}-

      - name: 解密并展开缓存
        if: github.event.inputs.cache != '0' && steps.prep.outputs.cachedir != ''
        env:
          CD: ${{ steps.prep.outputs.cachedir }}
        run: |
          set -uo pipefail
          K="$RUNNER_TEMP/d0"
          KC="$CD/d.ct"
          [ -s "$KC" ] || { [ -s "$CD/k.ct" ] && KC="$CD/k.ct"; }
          if [ ! -s "$CD/lc.tar.ct" ] || [ ! -s "$KC" ]; then
            echo "无可用缓存(首次运行或未命中) → 从空开始"
            exit 0
          fi
          if ! ACT_CACHE_D=$(openssl smime -decrypt -inform DER -inkey "$K/d0.bin" -in "$KC" 2>/dev/null); then
            rm -f "$CD/lc.tar.ct" "$KC"
            echo "::warning::缓存解不开(repo 公开材料与 Secret 不是同一对 → 换过密钥?) → 丢弃这份缓存"
            exit 0
          fi
          export ACT_CACHE_D
          ST="$HOME/.actcache-incoming"; rm -rf "$ST"; mkdir -p "$ST"
          if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ACT_CACHE_D -in "$CD/lc.tar.ct" \
               | tar -C "$ST" -xf -; then
            if [ ! -e "$HOME/local-cache" ]; then
              mv "$ST/local-cache" "$HOME/local-cache"
            else
              cp -a "$ST/local-cache/." "$HOME/local-cache/"
            fi
            rm -rf "$ST"
            echo "✓ 缓存已就位: $(du -sh "$HOME/local-cache" 2>/dev/null | cut -f1)"
          else
            rm -rf "$ST"
            echo "::warning::缓存解密/展开失败 → 跳过本次缓存"
          fi

      - name: 恢复组存储
        if: github.event.inputs.group != ''
        env:
          GRP: ${{ github.event.inputs.group }}
          SURL: ${{ github.event.inputs.store_url }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/actx"
          B="$RUNNER_TEMP/actx/oci-store"
          rm -f "$RUNNER_TEMP/actx/grp_restore_ok"
          if [ ! -s "$B" ]; then
            if ! curl -fsSL "$SURL" -o "$B"; then
              echo "::error::组存储: 工具取不到 ($SURL) → 本次从空开始, 并且**跳过收工推送**"
              exit 0
            fi
            chmod +x "$B"
          fi
          mkdir -p /tmp/storage
          "$B" restore /tmp/storage --tag "$GRP"
          rc=$?
          case "$rc" in
            0) echo "✓ 组存储已就位: /tmp/storage/$GRP"
               : > "$RUNNER_TEMP/actx/grp_restore_ok" ;;
            4) echo "组 '$GRP' 还没有快照(首次) → 从空开始"
               : > "$RUNNER_TEMP/actx/grp_restore_ok" ;;
            *) echo "::error::组存储拉取失败 (rc=$rc) → 会话从空目录开始, **收工不推送**(否则会把别人的快照覆盖成空); 本次改动不会被保存" ;;
          esac
          exit 0

      - name: 组存储推送助手
        if: github.event.inputs.group != ''
        run: |
          set +e
          set -uo pipefail
          D="$RUNNER_TEMP/actx"
          mkdir -p "$D"
          cat > "$D/store_push.sh" <<'ACTXPUSH'
          #!/bin/bash
          set +e
          set -uo pipefail
          GRP="$1"; SURL="$2"; LBL="${3:-推送}"
          A="$RUNNER_TEMP/actx"
          mkdir -p "$A"
          if [ ! -f "$A/grp_restore_ok" ]; then
            echo "::error::组存储[$LBL]: 本次开工时**没恢复成功** → 不推送(否则会把别人的快照覆盖成空的)。本轮的改动不会被保存。"
            exit 3
          fi
          D="/tmp/storage/$GRP"
          if [ ! -d "$D" ]; then
            echo "::warning::组存储[$LBL]: 没有 $D (会话没往组存储里写东西) → 不推"
            exit 4
          fi
          B="$A/oci-store"
          if [ ! -s "$B" ]; then
            if ! curl -fsSL "$SURL" -o "$B"; then
              echo "::error::组存储[$LBL]: 工具取不到 ($SURL) → 不推(本轮改动不会被保存)"
              exit 5
            fi
            chmod +x "$B"
          fi
          "$B" backup "$D" --tag "$GRP" -R gh
          rc=$?
          case "$rc" in
            0) echo "✓ 组存储[$LBL]: 已推送 (tag=$GRP)" ;;
            3) echo "::warning::组存储[$LBL]: 部分已传、快照未提交(rc=3) —— 可安全重跑, 已传的块会跳过" ;;
            4) echo "::warning::组存储[$LBL]: tag '$GRP' 没有可用快照(rc=4)" ;;
            *) echo "::error::组存储[$LBL]: 推送失败 (rc=$rc) —— **本轮改动没被保存**; 下次会话重跑会接上这块" ;;
          esac
          exit "$rc"
          ACTXPUSH
          chmod +x "$D/store_push.sh"
          echo "✓ 组存储推送助手就位: $D/store_push.sh"
          exit 0

      - name: 等待会话结束
        env:
          GRP: ${{ github.event.inputs.group }}
          SURL: ${{ github.event.inputs.store_url }}
          SIV: ${{ github.event.inputs.store_interval }}
        run: |
          set +e
          set -uo pipefail
          D="$RUNNER_TEMP/actx"
          P=$(cat "$D/session.pid" 2>/dev/null || echo "")
          if [ -z "$P" ]; then echo "::error::没有会话 pid"; exit 1; fi
          IV="${SIV:-}"
          case "$IV" in ''|*[!0-9]*) IV=900 ;; esac          # 旧模版 / 非数字 → 内置默认
          if [ -n "$GRP" ] && [ "$IV" -gt 0 ] && [ -x "$D/store_push.sh" ]; then
            next=$(( $(date +%s) + IV ))                     # 首轮**等一个间隔**: 刚恢复完没什么可推的
            echo "组存储: 会话期间每 ${IV}s 增量推送一次(收工时还会无条件再推一次 —— 补上「最后一点没到点」)"
          else
            IV=0
            [ -n "$GRP" ] && echo "组存储: 会话期间不推送(间隔=${SIV:-} )"
          fi
          n=0
          while kill -0 "$P" 2>/dev/null; do
            if [ "$IV" -gt 0 ] && [ "$(date +%s)" -ge "$next" ]; then
              n=$((n + 1))
              echo "---- 组存储定时推送 #$n ($(date -u +%Y-%m-%dT%H:%M:%SZ)) ----"
              "$D/store_push.sh" "$GRP" "$SURL" "定时#$n" || true
              next=$(( $(date +%s) + IV ))                   # 按**推完的时刻**重新计时(推送本身耗时)
            fi
            sleep 5
          done
          [ "$IV" -gt 0 ] && echo "组存储: 定时推送共 $n 轮(收工那次另算)"
          rc=$(cat "$D/session.rc" 2>/dev/null || echo 0)
          case "$rc" in ''|*[!0-9]*) rc=0 ;; esac
          echo "会话已结束 (rc=$rc)"
          echo "(public 模式: 输出不外泄 —— 尾部已密文回传; 查看: act-pubx <profile> logs)"
          exit "$rc"

      - name: 打包缓存
        if: always() && github.event.inputs.cache != '0' && steps.prep.outputs.cachedir != ''
        env:
          CD: ${{ steps.prep.outputs.cachedir }}
        run: |
          set -uo pipefail
          K="$RUNNER_TEMP/d0"
          if [ ! -d "$HOME/local-cache" ]; then echo "没有 ~/local-cache → 不保存"; exit 0; fi
          if [ ! -s "$K/e0.bin" ]; then echo "::warning::缺少公开材料 → 不保存缓存"; exit 0; fi
          rm -f "$CD/lc.tar.ct" "$CD/d.ct"
          ACT_CACHE_D=$(openssl rand -hex 32); export ACT_CACHE_D
          echo "打包 + 单流加密 (tar | openssl enc)..."
          set +e
          tar --warning=no-file-changed -C "$HOME" -cf - local-cache | \
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ACT_CACHE_D > "$CD/lc.tar.ct"
          ps=("${PIPESTATUS[@]}")
          set -e
          if [ "${ps[0]}" -le 1 ] && [ "${ps[1]}" -eq 0 ] && [ -s "$CD/lc.tar.ct" ]; then
            printf '%s' "$ACT_CACHE_D" | openssl smime -encrypt -aes256 -binary -outform DER \
              "$K/e0.bin" > "$CD/d.ct"
            echo "✓ 密文 $(du -sh "$CD/lc.tar.ct" | cut -f1) 待上传(公开缓存里只有密文)"
          else
            rm -f "$CD/lc.tar.ct" "$CD/d.ct"
            echo "::warning::打包/加密失败 (tar rc=${ps[0]}, enc rc=${ps[1]}) → 本次不保存"
          fi

      - name: 保存缓存
        if: always() && github.event.inputs.cache != '0' && steps.prep.outputs.cachedir != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prep.outputs.cachedir }}
          key: ${{ runner.os }}-actcache-${{ github.event.inputs.cache_ns }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 备份组存储
        if: always() && github.event.inputs.group != ''
        env:
          GRP: ${{ github.event.inputs.group }}
          SURL: ${{ github.event.inputs.store_url }}
        run: |
          set +e
          set -uo pipefail
          A="$RUNNER_TEMP/actx"
          if [ -x "$A/store_push.sh" ]; then
            "$A/store_push.sh" "$GRP" "$SURL" "收工"
            rc=$?
          else
            echo "::error::组存储: 推送助手不在 ($A/store_push.sh) → 本次不推(本轮改动不会被保存)"
            rc=9
          fi
          if [ "$rc" = 0 ]; then
            B="$A/oci-store"
            if [ -s "$B" ]; then
              "$B" clean --tag "$GRP" --keep "day=3,week=2,month=2" --max 20
              crc=$?
              case "$crc" in
                0) echo "✓ 组存储: 已按保留策略清理(day=3,week=2,month=2, 总数上限 20)" ;;
                *) echo "::warning::组存储: 保留清理失败 (rc=$crc) —— 快照还在, 只是没清(不影响本次备份)" ;;
              esac
            fi
          fi
          exit 0
